<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<title>Pintaresta Gallery - WebGPU</title>
<script src="./toolscanvsa2025dc.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.header{position:fixed;top:0;left:0;right:0;background:#fff;padding:16px 24px;z-index:1000;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.header-content{max-width:1640px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:700;color:#e60023;text-decoration:none;padding:12px 16px;border-radius:24px;transition:background .2s;cursor:pointer}
.logo:hover{background:#f0f0f0}
.search-container{flex:1;max-width:800px}
.search-bar{display:flex;align-items:center;background:#efefef;border-radius:24px;padding:12px 16px}
.search-bar input{flex:1;border:none;background:transparent;outline:none;font-size:16px;color:#333;padding:0 8px}
.nav-buttons{display:flex;gap:8px;flex-wrap:wrap}
.nav-btn{background:#efefef;border:none;padding:10px 20px;border-radius:24px;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;color:#211922;position:relative}
.nav-btn:hover:not(:disabled){background:#e1e1e1}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.upload-btn{background:#00d084;color:#fff}
.nav-btn.upload-btn:hover{background:#00b872}
.nav-btn input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.lote-info{padding:8px 16px;background:#efefef;border-radius:24px;font-size:12px;color:#5f5f5f;font-weight:500}
.main-content{margin-top:80px;padding:0 16px}
.pins-container{column-count:5;column-gap:16px;max-width:1640px;margin:0 auto}
@media(max-width:1536px){.pins-container{column-count:4}}
@media(max-width:1280px){.pins-container{column-count:3}}
@media(max-width:900px){.pins-container{column-count:2}}
@media(max-width:600px){.pins-container{column-count:1}}
.pin{break-inside:avoid;margin-bottom:16px;cursor:pointer;border-radius:16px;overflow:hidden;transition:all .3s;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.pin:hover{transform:scale(1.02);box-shadow:0 0 30px rgba(0,0,0,.1)}
.pin-image-container{position:relative;width:100%;overflow:hidden;border-radius:16px;background:#e0e0e0;display:flex;align-items:center;justify-content:center}
.pin-image{width:100%;display:block;transition:transform .3s;object-fit:cover}
.pin:hover .pin-image{transform:scale(1.03)}
.pin-image.model-thumb{width:100%;height:280px;object-fit:cover}
video.pin-image{background:#000}
video.pin-image::-webkit-media-controls{display:none!important}
.save-btn{position:absolute;top:12px;right:12px;background:#e60023;color:#fff;border:none;padding:10px 16px;border-radius:24px;font-weight:600;font-size:14px;cursor:pointer;opacity:0;transform:translateY(-4px);transition:all .2s;z-index:2}
.pin:hover .save-btn{opacity:1;transform:translateY(0)}
.save-btn:hover{background:#ad081b}
.pin-info{padding:12px;background:#fff}
.pin-title{font-size:14px;font-weight:600;color:#211922;margin-bottom:4px}
.pin-description{font-size:12px;color:#5f5f5f}
.pin-creator{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #efefef}
.creator-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e60023,#ff006e);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px}
.creator-name{font-size:12px;color:#211922;font-weight:500}
.h-280{height:280px}.h-320{height:320px}.h-360{height:360px}.h-400{height:400px}.h-440{height:440px}
.media-badge{position:absolute;top:10px;left:10px;background:rgba(230,0,35,.9);color:#fff;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:600;z-index:2}
.loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;z-index:3000;flex-direction:column;gap:20px}
.loading-spinner{width:50px;height:50px;border:4px solid #efefef;border-top:4px solid #e60023;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loading-text{font-size:16px;color:#5f5f5f}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-content{background:#fff;border-radius:16px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-content.sm{max-width:800px}
.modal-content.lg{max-width:95vw;height:90vh}
.modal-header{padding:16px 20px;border-bottom:1px solid #efefef;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.modal-header h2{margin:0;color:#211922;font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-body{padding:0;overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
.modal-footer{padding:16px 20px;border-top:1px solid #efefef;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}
.btn-modal{padding:8px 18px;border:none;border-radius:24px;font-weight:600;cursor:pointer;transition:all .2s;font-size:13px}
.btn-modal.primary{background:#e60023;color:#fff}
.btn-modal.primary:hover{background:#ad081b}
.btn-modal.secondary{background:#efefef;color:#211922}
.btn-modal.secondary:hover{background:#e1e1e1}
.json-preview{background:#f5f5f5;padding:15px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-wrap:break-word}
.stats-box{background:#f0f7ff;padding:15px;border-radius:8px;margin-bottom:15px}
.stats-box h3{margin:0 0 10px;color:#0066ff;font-size:14px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-item{text-align:center}
.stat-number{font-size:22px;font-weight:bold;color:#211922}
.stat-label{font-size:11px;color:#5f5f5f;margin-top:4px}
.video-wrap{background:#000;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.video-wrap video{max-width:100%;max-height:100%;display:block}
.video-controls{background:#111;padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.timeline-wrap{display:flex;align-items:center;gap:10px}
.timeline-wrap span{color:#aaa;font-size:12px;font-family:monospace;min-width:44px;text-align:center}
.timeline{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#444;outline:none;cursor:pointer}
.timeline::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e60023;cursor:pointer}
.vol-row{display:flex;align-items:center;gap:10px}
.vc-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;transition:background .2s;line-height:1}
.vc-btn:hover{background:#333}
.vol-slider{width:80px;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#555;outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.speed-select{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;outline:none}
.vc-spacer{flex:1}
.nav-btn2{position:relative;background-color:#efefef;color:#212121;border-radius:12px;width:80%;font-size:12px;border:none;height:37px;cursor:pointer;margin-top:4px;margin-bottom:4px;left:10%}
.nav-btn2:hover{background-color:#00d08457}
#idboxmenuitems{width:120px;height:600px;background-color:#23242767;z-index:99999;position:fixed;top:20%;right:0%;border-left:4px;border-color:#232427a6}
</style>

<script type="module">
import * as THREE from 'three';
import * as TSL from 'three/tsl';
import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
import { traa } from 'three/addons/tsl/display/TRAANode.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

class MinimalWebGPUViewer {
	constructor(containerId) {
		this.container = document.getElementById(containerId);
		if (!this.container) throw new Error(`Container #${containerId} not found`);
		
		this.container.style.position = 'relative';
		this.container.style.overflow = 'hidden';

		this.scene = null;
		this.camera = null;
		this.renderer = null;
		this.controls = null;
		this.renderPipeline = null;
		this.loadedModelsGroup = null;

		this.gltfLoader = new GLTFLoader();
		this.objLoader = new OBJLoader();
		this.fbxLoader = new FBXLoader();

		this.MODEL_THUMB = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnBg6cLuer28Z5mIhmk2pdS8Nsz-mPjxwXWw&s';

		this.injectCSS();
		this.buildUI();
		this.initThree();
	}

	injectCSS() {
		const styleId = 'wg-viewer-styles';
		if (document.getElementById(styleId)) return; 

		const style = document.createElement('style');
		style.id = styleId;
		style.textContent = `
			.wg-sidebar {
				position: absolute; top: 15px; left: 15px; width: 240px; max-height: 90%;
				overflow-y: auto; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px);
				border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 15px;
				display: flex; flex-direction: column; gap: 12px;
				font-family: system-ui, sans-serif; color: #eee;
				box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
			}
			.wg-sidebar::-webkit-scrollbar { width: 6px; }
			.wg-sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
			.wg-sidebar h3 { margin: 0; font-size: 14px; font-weight: 500; text-align: center; color: #ccc; border-bottom: 1px solid #333; padding-bottom: 5px; }
			.wg-sidebar input[type="file"], .wg-sidebar input[type="text"], .wg-sidebar select {
				font-size: 11px; color: #aaa; background: rgba(0, 0, 0, 0.3); padding: 6px;
				border-radius: 4px; border: 1px dashed rgba(255, 255, 255, 0.2);
				cursor: pointer; width: 100%; box-sizing: border-box; outline: none;
			}
			.wg-sidebar input[type="text"] { border: 1px solid rgba(255, 255, 255, 0.2); cursor: text; }
			.wg-sidebar select { border: 1px solid rgba(255, 255, 255, 0.2); }
			.wg-sidebar button {
				background: #333; color: #fff; border: 1px solid rgba(255,255,255,0.1);
				padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s;
			}
			.wg-sidebar button:hover { background: #555; }
			.wg-sidebar button:active { background: #222; }
			.wg-control-group { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #bbb; }
			.wg-control-group .wg-row { display: flex; justify-content: space-between; align-items: center; }
			.wg-sidebar input[type="range"] { width: 100%; accent-color: #aaa; cursor: pointer; }
			
			.wg-drag-overlay {
				position: absolute; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(0, 0, 0, 0.6); color: white; display: none;
				align-items: center; justify-content: center; font-size: 24px;
				font-family: system-ui, sans-serif; z-index: 20; pointer-events: none;
			}
		`;
		document.head.appendChild(style);
	}

	buildUI() {
		const sidebar = document.createElement('div');
		sidebar.className = 'wg-sidebar';
		sidebar.innerHTML = `
			<h3>Modelos 3D</h3>
			<input type="file" id="wg-file-input" accept=".glb,.gltf,.obj,.fbx">
			
			<input type="text" id="wg-url-input" placeholder="Pegar URL del modelo...">
			<button id="wg-btn-load-url">Cargar desde URL</button>

			<button id="wg-btn-clear" style="margin-top: 5px;">Limpiar Escena</button>
			<button id="wg-btn-download">Descargar (GLB)</button>
			
			<h3 style="margin-top: 10px;">Iluminación Global</h3>
			
			<div class="wg-control-group">
				<div class="wg-row"><label>AO Intensity</label><span id="wg-val-ao">2.0</span></div>
				<input type="range" id="wg-ssgi-ao" min="0" max="8" step="0.1" value="2.0">
			</div>

			<div class="wg-control-group">
				<div class="wg-row"><label>GI Intensity</label><span id="wg-val-gi">15</span></div>
				<input type="range" id="wg-ssgi-gi" min="0" max="100" step="1" value="15">
			</div>

			<div class="wg-control-group">
				<div class="wg-row"><label>Radius</label><span id="wg-val-rad">8</span></div>
				<input type="range" id="wg-ssgi-radius" min="1" max="25" step="1" value="8">
			</div>

			<div class="wg-control-group">
				<div class="wg-row"><label>Pasos (Calidad)</label><span id="wg-val-steps">8</span></div>
				<input type="range" id="wg-ssgi-steps" min="1" max="32" step="1" value="8">
			</div>

			<div class="wg-control-group">
				<label class="wg-row" style="cursor: pointer; justify-content: flex-start; gap: 8px;">
					<input type="checkbox" id="wg-ssgi-temporal" checked> Suavizado Temporal (TRAA)
				</label>
			</div>
		`;
		this.container.appendChild(sidebar);

		const dragOverlay = document.createElement('div');
		dragOverlay.className = 'wg-drag-overlay';
		dragOverlay.id = 'wg-drag-overlay';
		dragOverlay.innerText = 'Suelta el archivo aquí...';
		this.container.appendChild(dragOverlay);
	}

	initThree() {
		const width = this.container.clientWidth;
		const height = this.container.clientHeight;

		this.camera = new THREE.PerspectiveCamera(45, width / height || 1, 0.1, 1000);
		this.camera.position.set(0, 5, 15);

		this.scene = new THREE.Scene();
		this.loadedModelsGroup = new THREE.Group();
		this.scene.add(this.loadedModelsGroup);

		this.renderer = new THREE.WebGPURenderer({ antialias: false });
		this.renderer.setSize(width || 1, height || 1);
		this.renderer.setPixelRatio(window.devicePixelRatio);
		this.renderer.shadowMap.enabled = true;
		this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
		this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
		this.renderer.toneMappingExposure = 1.2;
		
		this.container.appendChild(this.renderer.domElement);

		this.controls = new OrbitControls(this.camera, this.renderer.domElement);
		this.controls.enableDamping = true;
		this.controls.target.set(0, 2, 0);

		this.setupEnvironment();
		this.setupSSGI();
		this.setupEvents();

		this.renderer.setAnimationLoop(() => {
			this.controls.update();
			if (this.renderPipeline) this.renderPipeline.render();
		});
	}

	setupEnvironment() {
		const texLoader = new THREE.TextureLoader();
		texLoader.load('https://cdn.polyhaven.com/asset_img/primary/sunset_meadow_path.png?height=760', (texture) => {
			texture.mapping = THREE.EquirectangularReflectionMapping;
			texture.colorSpace = THREE.SRGBColorSpace;
			this.scene.background = texture;
			this.scene.environment = texture;
		});

		const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
		this.scene.add(ambientLight);

		const dirLight = new THREE.DirectionalLight(0xffffff, 2);
		dirLight.position.set(5, 10, 5);
		dirLight.castShadow = true;
		dirLight.shadow.mapSize.width = 2048;
		dirLight.shadow.mapSize.height = 2048;
		this.scene.add(dirLight);
	}

	setupSSGI() {
		const { pass, mrt, output, normalView, diffuseColor, velocity, add, vec3, vec4, packNormalToRGB, unpackRGBToNormal, sample } = TSL;

		this.renderPipeline = new THREE.RenderPipeline(this.renderer);

		const scenePass = pass(this.scene, this.camera);
		scenePass.setMRT(mrt({
			output: output,
			diffuseColor: diffuseColor,
			normal: packNormalToRGB(normalView),
			velocity: velocity
		}));

		const scenePassColor = scenePass.getTextureNode('output');
		const scenePassDiffuse = scenePass.getTextureNode('diffuseColor');
		const scenePassDepth = scenePass.getTextureNode('depth');
		const scenePassNormal = scenePass.getTextureNode('normal');
		const scenePassVelocity = scenePass.getTextureNode('velocity');

		const sceneNormal = sample((uv) => unpackRGBToNormal(scenePassNormal.sample(uv)));

		const giPass = ssgi(scenePassColor, scenePassDepth, sceneNormal, this.camera);
		giPass.sliceCount.value = 2;       
		giPass.stepCount.value = 8;        
		giPass.radius.value = 8.0;         
		giPass.aoIntensity.value = 2.0;    
		giPass.giIntensity.value = 15.0;   
		giPass.useTemporalFiltering = true; 

		const ao = giPass.getAONode();
		const gi = giPass.getGINode();
		const compositePass = vec4(add(scenePassColor.rgb.mul(ao.r), (scenePassDiffuse.rgb.mul(gi.rgb))), scenePassColor.a);
		const traaPass = traa(compositePass, scenePassDepth, scenePassVelocity, this.camera);
		
		this.renderPipeline.outputNode = traaPass;

		const q = (id) => this.container.querySelector(id);
		
		const elAO = q('#wg-ssgi-ao');
		const elGI = q('#wg-ssgi-gi');
		const elRad = q('#wg-ssgi-radius');
		const elSteps = q('#wg-ssgi-steps');
		const elTemp = q('#wg-ssgi-temporal');

		const updateDisplay = (id, val) => q(id).textContent = val;

		elAO.addEventListener('input', (e) => { giPass.aoIntensity.value = parseFloat(e.target.value); updateDisplay('#wg-val-ao', e.target.value); });
		elGI.addEventListener('input', (e) => { giPass.giIntensity.value = parseFloat(e.target.value); updateDisplay('#wg-val-gi', e.target.value); });
		elRad.addEventListener('input', (e) => { giPass.radius.value = parseFloat(e.target.value); updateDisplay('#wg-val-rad', e.target.value); });
		elSteps.addEventListener('input', (e) => { giPass.stepCount.value = parseFloat(e.target.value); updateDisplay('#wg-val-steps', e.target.value); });

		const updatePipeline = () => {
			const useTraa = elTemp.checked;
			giPass.useTemporalFiltering = useTraa;
			this.renderPipeline.outputNode = useTraa ? traaPass : compositePass;
			this.renderPipeline.needsUpdate = true;
		};

		elTemp.addEventListener('change', updatePipeline);
	}

	processLoadedModel(object) {
		let model = object.scene || object;
		
		model.traverse((child) => {
			if (child.isMesh) {
				child.castShadow = true;
				child.receiveShadow = true;
			}
		});
		
		this.loadedModelsGroup.add(model);
		
		const box = new THREE.Box3().setFromObject(model);
		const center = box.getCenter(new THREE.Vector3());
		const size = box.getSize(new THREE.Vector3());
		
		this.controls.target.copy(center);
		this.camera.position.set(
			center.x, 
			center.y + size.y, 
			center.z + Math.max(size.x, size.z) * 1.5
		);
	}

	loadModelFromUrl(url, explicitExtension = null) {
		const extension = explicitExtension || url.split('.').pop().split(/\#|\?/)[0].toLowerCase();

		const onLoad = (object) => {
			this.processLoadedModel(object);
			if (url.startsWith('blob:')) URL.revokeObjectURL(url);
		};

		const onProgress = (xhr) => {
			console.log(`Cargando modelo: ${(xhr.loaded / xhr.total * 100)}%`);
		};

		const onError = (error) => {
			console.error('Error al cargar el modelo:', error);
			alert('Error al cargar el modelo. Verifica la URL y CORS.');
		};

		if (extension === 'glb' || extension === 'gltf') {
			this.gltfLoader.load(url, onLoad, onProgress, onError);
		} else if (extension === 'obj') {
			this.objLoader.load(url, onLoad, onProgress, onError);
		} else if (extension === 'fbx') {
			this.fbxLoader.load(url, onLoad, onProgress, onError);
		} else {
			console.error('Formato no soportado:', extension);
			alert('Formato no soportado. Solo GLB, GLTF, OBJ, FBX.');
		}
	}

	clearScene() {
		while (this.loadedModelsGroup.children.length > 0) {
			const obj = this.loadedModelsGroup.children[0];
			this.loadedModelsGroup.remove(obj);
			obj.traverse((c) => {
				if (c.isMesh) {
					if (c.geometry) c.geometry.dispose();
					if (c.material) {
						if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
						else c.material.dispose();
					}
				}
			});
		}
	}

	resize() {
		if(!this.container || !this.camera || !this.renderer) return;
		const width = this.container.clientWidth;
		const height = this.container.clientHeight;
		if(width === 0 || height === 0) return;
		this.camera.aspect = width / height;
		this.camera.updateProjectionMatrix();
		this.renderer.setSize(width, height);
	}

	setupEvents() {
		const q = (id) => this.container.querySelector(id);
		
		const resizeObserver = new ResizeObserver(() => this.resize());
		resizeObserver.observe(this.container);

		const processFile = (file) => {
			const extension = file.name.split('.').pop().toLowerCase();
			const url = URL.createObjectURL(file);
			this.loadModelFromUrl(url, extension);
		};

		q('#wg-file-input').addEventListener('change', (e) => {
			if (e.target.files.length > 0) processFile(e.target.files[0]);
			e.target.value = ''; 
		});

		q('#wg-btn-load-url').addEventListener('click', () => {
			const url = q('#wg-url-input').value;
			if(url) {
				this.loadModelFromUrl(url);
				q('#wg-url-input').value = '';
			}
		});

		const dragOverlay = q('#wg-drag-overlay');
		this.container.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.style.display = 'flex'; });
		this.container.addEventListener('dragleave', () => dragOverlay.style.display = 'none');
		this.container.addEventListener('drop', (e) => {
			e.preventDefault(); dragOverlay.style.display = 'none';
			if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
		});

		q('#wg-btn-clear').addEventListener('click', () => this.clearScene());

		q('#wg-btn-download').addEventListener('click', () => {
			const exporter = new GLTFExporter();
			exporter.parse(this.loadedModelsGroup, (result) => {
				const output = result instanceof ArrayBuffer ? result : JSON.stringify(result);
				const blob = new Blob([output], { type: result instanceof ArrayBuffer ? 'application/octet-stream' : 'text/plain' });
				const url = URL.createObjectURL(blob);
				const link = document.createElement('a');
				link.href = url;
				link.download = 'modelo_webgpu.glb';
				link.click();
				URL.revokeObjectURL(url);
			}, (err) => console.error(err), { binary: true });
		});
	}

	async open(mediaData) {
		document.getElementById('modal3D').classList.add('active');
		setTimeout(() => this.resize(), 50);
		this.clearScene();
		this.loadModelFromUrl(mediaData.url, mediaData.extension.replace('.', ''));
	}

	close() {
		document.getElementById('modal3D').classList.remove('active');
		this.clearScene();
	}
}

const ThreeModal = new MinimalWebGPUViewer('webgpu-container');

const VideoModal = (() => {
  const vid      = document.getElementById('modalVideoEl');
  const tl       = document.getElementById('vcTimeline');
  const cur      = document.getElementById('vcCurrent');
  const dur      = document.getElementById('vcDuration');
  const btnPlay  = document.getElementById('vcPlay');
  const btnMute  = document.getElementById('vcMute');
  const volSl    = document.getElementById('vcVol');
  const speedSel = document.getElementById('vcSpeed');
  let dragging   = false;

  vid.ontimeupdate     = () => { if (!dragging) { tl.value = vid.currentTime; cur.textContent = fmtTime(vid.currentTime); } };
  vid.onloadedmetadata = () => { tl.max = vid.duration; dur.textContent = fmtTime(vid.duration); };
  vid.onplay           = () => btnPlay.innerHTML = '&#9646;&#9646;';
  vid.onpause          = () => btnPlay.innerHTML = '&#9654;';
  tl.oninput           = () => { dragging = true; cur.textContent = fmtTime(tl.value); };
  tl.onchange          = () => { vid.currentTime = tl.value; dragging = false; };
  btnPlay.onclick      = () => vid.paused ? vid.play() : vid.pause();
  btnMute.onclick      = () => { vid.muted = !vid.muted; btnMute.innerHTML = vid.muted ? '&#128264;' : '&#128266;'; };
  volSl.oninput        = () => { vid.volume = volSl.value; vid.muted = +volSl.value === 0; btnMute.innerHTML = vid.muted ? '&#128264;' : '&#128266;'; };
  document.getElementById('vcBack').onclick = () => vid.currentTime = Math.max(0, vid.currentTime - 5);
  document.getElementById('vcFwd').onclick  = () => vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
  speedSel.onchange = () => vid.playbackRate = +speedSel.value;
  document.getElementById('vcFs').onclick   = () => { const w = document.getElementById('modalVideo'); (w.requestFullscreen || w.webkitRequestFullscreen).call(w); };

  document.addEventListener('keydown', e => {
    if (!document.getElementById('modalVideo').classList.contains('active')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if      (e.code === 'Space')      { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    else if (e.code === 'ArrowLeft')  vid.currentTime = Math.max(0, vid.currentTime - 5);
    else if (e.code === 'ArrowRight') vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
    else if (e.code === 'ArrowUp')    { vid.volume = Math.min(1, vid.volume + .1); volSl.value = vid.volume; }
    else if (e.code === 'ArrowDown')  { vid.volume = Math.max(0, vid.volume - .1); volSl.value = vid.volume; }
    else if (e.key === 'm' || e.key === 'M') { vid.muted = !vid.muted; btnMute.innerHTML = vid.muted ? '&#128264;' : '&#128266;'; }
  });

  return {
    open(url, nombre) {
      document.getElementById('videoModalTitle').textContent = nombre;
      vid.src = url;
      vid.load();
      vid.play().catch(() => {});
      document.getElementById('modalVideo').classList.add('active');
    },
    close() {
      vid.pause();
      vid.src = '';
      document.getElementById('modalVideo').classList.remove('active');
    }
  };
})();

function fmtTime(s) {
	if(isNaN(s)) return '0:00';
	const m = Math.floor(s / 60);
	const sec = Math.floor(s % 60);
	return `${m}:${sec.toString().padStart(2, '0')}`;
}

class PintarestaGallery {
  constructor() {
    this.todasLasUrls       = [];
    this.urlsFiltradas      = [];
    this.loteActual         = 0;
    this.imagenesPorLote    = 30;
    this.todosLosRepositorios = [
      { id:'img1',        owner:'unonibes4a', name:'img1' }, 
      { id:'MESH3D',        owner:'unonibes4a', name:'MESH3D' }, 
    ];
    this.extensionesValidas = {
      imagen: ['.jpg','.jpeg','.png','.gif','.bmp','.webp','.svg','.tiff','.tif','.ico','.heic','.heif'],
      video:  ['.mp4','.webm','.avi','.mov','.mkv','.flv','.wmv','.m4v','.mpeg','.mpg','.3gp'],
      model:  ['.glb','.gltf','.obj','.fbx']
    };
    this.jsonData = null;
    this.handleKeyDown = this.handleKeyDown.bind(this);
    window.todosLosRepositorios = this.todosLosRepositorios;
    
    document.addEventListener("keydown", this.handleKeyDown);

    const body = document.body;
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((eventName) => {
      body.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    body.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        if (file.type === 'application/json' || file.name.endsWith('.json')) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            await this.cargarDesdeJSON(event.target.result);
          };
          reader.readAsText(file);
        }
      }
    });
  }

  async handleKeyDown(event) {
    if (event.ctrlKey && event.key === "ArrowDown") {
      event.preventDefault();
      const unidos = confirm("¿Deseas descargar los JSON de todos los repositorios unidos en un solo archivo?\n\n[Aceptar] = Un solo archivo (Todos unidos)\n[Cancelar] = Archivos separados por repositorio");
      await this.descargarJSONRepositorios(window.todosLosRepositorios, unidos);
    }
  }

  descargarArchivoJSON(data, filename) {
	const jsonString = JSON.stringify(data, null, 2);
	const blob = new Blob([jsonString], { type: "application/json" });
	const url = URL.createObjectURL(blob);
	const a = document.createElement("a");
	a.href = url;
	a.download = filename;
	document.body.appendChild(a);
	a.click();
	document.body.removeChild(a);
	URL.revokeObjectURL(url);
  }

  exportarArrayAJson = (arrayDeObjetos) => {
	if (!arrayDeObjetos || !Array.isArray(arrayDeObjetos) || arrayDeObjetos.length === 0) return;
    this.descargarArchivoJSON(arrayDeObjetos, `galeria_pintaresta_${Date.now()}.json`);
  }

  async descargarJSONRepositorios(repos, unidos) {
    if (!repos || !Array.isArray(repos) || repos.length === 0) return;
    
    this.mostrarCargando(true, "Obteniendo datos de los repositorios...");
    let jsonUnido = [];

    for (const repoItem of repos) {
      let owner = "", repoName = "", branch = "main";

      if (typeof repoItem === "string") {
        const parts = repoItem.replace("https://github.com/", "").split("/").filter(Boolean);
        owner = parts[0];
        repoName = parts[1];
      } else if (typeof repoItem === "object") {
        owner = repoItem.owner || repoItem.usuario || repoItem.user;
        repoName = repoItem.repo || repoItem.nombre || repoItem.name;
        branch = repoItem.branch || repoItem.rama || "main";
      }

      if (!owner || !repoName) continue;

      try {
        let apiUrl = `https://api.github.com/repos/${owner}/${repoName}/git/trees/${branch}?recursive=1`;
        let response = await fetch(apiUrl);

        if (!response.ok) {
          branch = "master";
          apiUrl = `https://api.github.com/repos/${owner}/${repoName}/git/trees/${branch}?recursive=1`;
          response = await fetch(apiUrl);
        }

        if (!response.ok) continue;

        const data = await response.json();
        let repoResult = [];

        if (data && data.tree) {
          data.tree.forEach((file) => {
            if (file.type === "blob" && this.esMediaValido(file.path)) {
              const ext = file.path.substring(file.path.lastIndexOf(".")).toLowerCase();
              const rawUrl = `https://github.com/${owner}/${repoName}/blob/${branch}/${file.path}?raw=true`;
              
              const itemData = {
                repositorio: `${owner}/${repoName}`,
                repo: repoName,
                nombre: file.path.split("/").pop(),
                path: file.path,
                url: rawUrl,
                extension: ext,
                tipo: this.esImagen(file.path) ? 'imagen' : this.esVideo(file.path) ? 'video' : 'model'
              };

              repoResult.push(itemData);
              if (unidos) jsonUnido.push(itemData);
            }
          });
        }

        if (!unidos && repoResult.length > 0) {
          this.descargarArchivoJSON(repoResult, `repo_${repoName}_${Date.now()}.json`);
        }
      } catch (error) {
        console.error(`Error procesando ${owner}/${repoName}:`, error);
      }
    }

    if (unidos && jsonUnido.length > 0) {
      this.descargarArchivoJSON(jsonUnido, `todos_los_repos_${Date.now()}.json`);
    }

    this.mostrarCargando(false);
  }

  esImagen(n)     { return this.extensionesValidas.imagen.includes(n.toLowerCase().substring(n.lastIndexOf('.'))); }
  esVideo(n)      { return this.extensionesValidas.video.includes(n.toLowerCase().substring(n.lastIndexOf('.'))); }
  esModelo3D(n)   { return this.extensionesValidas.model.includes(n.toLowerCase().substring(n.lastIndexOf('.'))); }
  esMediaValido(n){ return this.esImagen(n) || this.esVideo(n) || this.esModelo3D(n); }
  obtenerNombreArchivo(p) { return p.split('/').pop().replace(/\.[^/.]+$/, ''); }
  formatBytes(b) {
    if (!b) return '0 B';
    const k = 1024, s = ['B','KB','MB','GB'], i = Math.floor(Math.log(b) / Math.log(k));
    return parseFloat((b / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
  }
  barajarArray(a) {
    const s = [...a];
    for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
    return s;
  }

  async cargarDesdeDirectorio(url, rutaBase = '', repoName = '') {
    const urls = [];
    try {
      const r = await fetch(url);
      if (!r.ok) return urls;
      const data = await r.json();
      for (const item of data) {
        if (item.type === 'file' && this.esMediaValido(item.name)) {
          const tipo = this.esImagen(item.name) ? 'imagen' : this.esVideo(item.name) ? 'video' : 'model';
          urls.push({ url: item.download_url, nombre: this.obtenerNombreArchivo(item.name), repo: repoName, tipo, extension: item.name.toLowerCase().substring(item.name.lastIndexOf('.')) });
        } else if (item.type === 'dir') {
          urls.push(...await this.cargarDesdeDirectorio(item.url, `${rutaBase}${item.name}/`, repoName));
        }
      }
    } catch(e) {}
    return urls;
  }

  async cargarDesdeRepositorio(repo) {
    try { 
		let a = await this.cargarDesdeDirectorio(`https://api.github.com/repos/${repo.owner}/${repo.name}/contents`, '', repo.name);
      	return a;
    }
    catch(e) { return []; }
  }

  async cargarDesdeJSON(jsonData) {
    this.mostrarCargando(true, 'Cargando imágenes desde JSON...');
    try {
      let datos = jsonData;

      if (typeof jsonData === 'string') {
        datos = JSON.parse(jsonData);
      }

      if (datos && !Array.isArray(datos) && Array.isArray(datos.archivos)) {
        datos = datos.archivos;
      }

      if (!datos || !Array.isArray(datos) || datos.length === 0) {
        document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><h3>JSON vacío o sin formato válido</h3></div>`;
        return [];
      }

      const todos = datos.map(item => {
        const ext = item.extension || (item.url ? item.url.substring(item.url.lastIndexOf('.')) : '.jpg');
        const tipo = item.tipo || (this.esImagen(ext) ? 'imagen' : this.esVideo(ext) ? 'video' : 'model');

        return {
          url: item.url,
          nombre: item.nombre || this.obtenerNombreArchivo(item.url || 'Sin título'),
          repo: item.repo || item.repositorio || 'JSON Local',
          tipo: tipo,
          extension: ext,
          tamañoLegible: item.tamañoLegible || item.tamaño || ''
        };
      }).filter(item => item.url);

      if (!todos.length) {
        document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><h3>No se encontraron URLs válidas en el JSON</h3></div>`;
        return [];
      }

      this.todasLasUrls  = this.barajarArray(todos);
      this.urlsFiltradas = [...this.todasLasUrls];
      this.loteActual    = 0;
      this.mostrarLote();

      return this.todasLasUrls;
    } catch(e) {
      document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><p>Error al procesar el archivo JSON: ${e.message}</p></div>`;
      return [];
    } finally { 
      this.mostrarCargando(false); 
    }
  }

  async cargarRepositoriosEspecificos(reposACargar) {
    this.mostrarCargando(true, 'Cargando repositorios...');
    try {
      const todos = (await Promise.all(reposACargar.map(r => this.cargarDesdeRepositorio(r)))).flat();
      if (!todos.length) {
        document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><h3>Sin archivos</h3></div>`;
        return [];
      }
      return this.barajarArray(todos);
    } catch(e) {
      document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><p>${e.message}</p></div>`;
      return [];
    } finally { this.mostrarCargando(false); }
  }

  async procesarArchivosLocales(files) {
    const validos = [], promesas = [];
    let img = 0, vid = 0, mod = 0;
    for (const file of files) {
      if (!this.esMediaValido(file.name)) continue;
      const tipo = this.esImagen(file.name) ? (img++, 'imagen') : this.esVideo(file.name) ? (vid++, 'video') : (mod++, 'model');
      promesas.push(new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = async e => {
          const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
          const d = { url: e.target.result, nombre: this.obtenerNombreArchivo(file.name), nombreCompleto: file.name, repo: 'Local', tipo, extension: ext, tamaño: file.size, tamañoLegible: this.formatBytes(file.size), fechaModificacion: file.lastModified, ruta: file.webkitRelativePath || file.name };
          validos.push(d);
          resolve();
        };
        reader.readAsDataURL(file);
      }));
    }
    await Promise.all(promesas);
    this.jsonData = { fecha_generacion: new Date().toISOString(), total_archivos: validos.length, imagenes: img, videos: vid, modelos: mod, archivos: validos.map(a => ({ nombre: a.nombre, nombreCompleto: a.nombreCompleto, ruta: a.ruta, tipo: a.tipo, extension: a.extension, tamaño: a.tamañoLegible, fechaModificacion: new Date(a.fechaModificacion).toISOString() })) };
    return validos;
  }

  async cargarArchivosLocales(files) {
    this.mostrarCargando(true, 'Procesando archivos...');
    try {
      const local = await this.procesarArchivosLocales(files);
      if (!local.length) { alert('No se encontraron archivos válidos'); return; }
      this.todasLasUrls  = this.barajarArray(local);
      this.urlsFiltradas = [...this.todasLasUrls];
      this.loteActual    = 0;
      this.mostrarLote();
      document.getElementById('btnViewJSON').style.display = 'block';
      alert(`Cargados ${local.length} archivos\nImágenes: ${this.jsonData.imagenes}\nVideos: ${this.jsonData.videos}\nModelos 3D: ${this.jsonData.modelos}`);
    } catch(e) { alert('Error: ' + e.message); }
    finally { this.mostrarCargando(false); }
  }

  mostrarJSON() {
    if (!this.jsonData) { alert('Primero carga una carpeta'); return; }
    document.getElementById('statsContainer').innerHTML = `<h3>Estadísticas</h3><div class="stats-grid"><div class="stat-item"><div class="stat-number">${this.jsonData.total_archivos}</div><div class="stat-label">Total</div></div><div class="stat-item"><div class="stat-number">${this.jsonData.imagenes}</div><div class="stat-label">Imágenes</div></div><div class="stat-item"><div class="stat-number">${this.jsonData.videos}</div><div class="stat-label">Videos</div></div><div class="stat-item"><div class="stat-number">${this.jsonData.modelos}</div><div class="stat-label">Modelos 3D</div></div></div>`;
    document.getElementById('jsonPreview').textContent = JSON.stringify(this.jsonData, null, 2);
    document.getElementById('modalJSON').classList.add('active');
  }

  descargarJSON() {
    if (!this.jsonData) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this.jsonData, null, 2)], { type: 'application/json' }));
    a.download = `galeria_${Date.now()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  copiarJSON() {
    if (!this.jsonData) return;
    navigator.clipboard.writeText(JSON.stringify(this.jsonData, null, 2))
      .then(() => alert('JSON copiado'))
      .catch(() => alert('Error al copiar'));
  }

  mostrarCargando(show, msg = 'Cargando...') {
    document.getElementById('loadingScreen').style.display = show ? 'flex' : 'none';
    document.querySelector('.loading-text').textContent = msg;
  }

  crearPinElement(mediaData) {
    const pin    = document.createElement('div');
    pin.className = 'pin';
    const alturas = ['h-280','h-320','h-360','h-400','h-440'];
    const alt     = alturas[Math.floor(Math.random() * alturas.length)];
    const esLocal = mediaData.repo === 'Local';
    const av      = esLocal ? 'PC' : 'GH';
    const cr      = esLocal ? 'Mi PC' : 'GitHub';
    const desc    = mediaData.repo + (esLocal && mediaData.tamañoLegible ? ' - ' + mediaData.tamañoLegible : '');
    const infoHTML = `<div class="pin-info"><div class="pin-title">${mediaData.nombre}</div><div class="pin-description">${desc}</div><div class="pin-creator"><div class="creator-avatar">${av}</div><div class="creator-name">${cr}</div></div></div>`;

    if (mediaData.tipo === 'video') {
      pin.innerHTML = `<div class="pin-image-container"><video class="pin-image ${alt}" ${esLocal ? 'src' : 'data-src'}="${mediaData.url}" muted loop playsinline preload="none"></video><div class="media-badge">VIDEO</div><button class="save-btn">Guardar</button></div>${infoHTML}`;
      const v = pin.querySelector('video');
      if (!esLocal && v.dataset.src) {
        const ob = new IntersectionObserver(e => { if (e[0].isIntersecting && v.dataset.src) { v.src = v.dataset.src; v.load(); v.removeAttribute('data-src'); ob.unobserve(v); } });
        ob.observe(v);
      }
      v.addEventListener('mouseenter', () => v.play().catch(() => {}));
      v.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      v.onclick = e => { e.stopPropagation(); VideoModal.open(mediaData.url, mediaData.nombre); };
    } else if (mediaData.tipo === 'imagen') {
      pin.innerHTML = `<div class="pin-image-container"><img class="pin-image ${alt}" ${esLocal ? 'src' : 'data-src'}="${mediaData.url}" alt="${mediaData.nombre}" loading="lazy"><button class="save-btn">Guardar</button></div>${infoHTML}`;
      const img = pin.querySelector('img');
      if (!esLocal && img.dataset.src) {
        const ob = new IntersectionObserver(e => { if (e[0].isIntersecting && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); ob.unobserve(img); } });
        ob.observe(img);
      }
      img.onclick  = e => { e.stopPropagation(); if (window.appEditorgioBasico?.parentElement) { window.appEditorgioBasico.setImage(img.src); window.appEditorgioBasico.openappf(); } };
      img.onerror  = function() { this.style.background = '#f0f0f0'; this.alt = 'Error'; };
    } else if (mediaData.tipo === 'model') {
      pin.innerHTML = `<div class="pin-image-container"><img class="pin-image model-thumb ${alt}" src="${ThreeModal.MODEL_THUMB}" alt="${mediaData.nombre}" loading="lazy"><div class="media-badge">3D MODEL</div><button class="save-btn">Guardar</button></div>${infoHTML}`;
      pin.querySelector('img').onclick = e => { e.stopPropagation(); ThreeModal.open(mediaData); };
    }

    const saveBtn = pin.querySelector('.save-btn');
    if (saveBtn) saveBtn.onclick = e => {
      e.stopPropagation();
      const a = document.createElement('a');
      a.href     = mediaData.url;
      a.download = mediaData.nombreCompleto || `${mediaData.nombre}${mediaData.extension}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
    return pin;
  }

  obtenerLoteActual() {
    const i = this.loteActual * this.imagenesPorLote;
    return this.barajarArray(this.urlsFiltradas.slice(i, i + this.imagenesPorLote));
  }

  actualizarBotones() {
    const total = Math.ceil(this.urlsFiltradas.length / this.imagenesPorLote);
    document.getElementById('btnBack').disabled = this.loteActual === 0;
    document.getElementById('btnNext').disabled = this.loteActual >= total - 1;
    const i   = this.loteActual * this.imagenesPorLote + 1;
    const f   = Math.min((this.loteActual + 1) * this.imagenesPorLote, this.urlsFiltradas.length);
    const img = this.urlsFiltradas.filter(m => m.tipo === 'imagen').length;
    const vid = this.urlsFiltradas.filter(m => m.tipo === 'video').length;
    const mod = this.urlsFiltradas.filter(m => m.tipo === 'model').length;
    document.getElementById('loteInfo').textContent = `${i}-${f} de ${this.urlsFiltradas.length} (IMG ${img} VID ${vid} 3D ${mod})`;
  }

  mostrarLote() {
    const c = document.getElementById('pinsContainer');
    c.innerHTML = '';
    const archivos = this.obtenerLoteActual();
    if (!archivos.length) { c.innerHTML = '<div style="text-align:center;padding:40px;color:#767676;grid-column:1/-1">No hay archivos</div>'; return; }
    const frag = document.createDocumentFragment();
    archivos.forEach(m => frag.appendChild(this.crearPinElement(m)));
    c.appendChild(frag);
    this.actualizarBotones();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  filtrarMedia(q) {
    const b = q.toLowerCase().trim();
    this.urlsFiltradas = b ? this.todasLasUrls.filter(m => m.nombre.toLowerCase().includes(b) || m.repo.toLowerCase().includes(b) || (m.tipo === 'model' && '3d model'.includes(b))) : [...this.todasLasUrls];
    this.loteActual = 0;
    this.mostrarLote();
  }

  async siguienteLote() { if (this.loteActual < Math.ceil(this.urlsFiltradas.length / this.imagenesPorLote) - 1) { this.loteActual++; this.mostrarLote(); } }
  async loteAnterior()  { if (this.loteActual > 0) { this.loteActual--; this.mostrarLote(); } }
  async recargar()      { this.loteActual = 0; await this.iniciar(); }

  async iniciar(repos = this.todosLosRepositorios) {
    const urls = await this.cargarRepositoriosEspecificos(repos);
    if (urls.length) { this.todasLasUrls = urls; this.urlsFiltradas = [...urls]; this.loteActual = 0; this.mostrarLote(); }
  }

  async cargarCategoria(categoryId) {
    const repo = this.todosLosRepositorios.find(r => r.id === categoryId);
    if (repo) {
      document.getElementById('pinsContainer').innerHTML = '';
      this.todasLasUrls  = [];
      this.urlsFiltradas = [];
      this.loteActual    = 0;
      await this.iniciar([repo]);
    } else {
      document.getElementById('pinsContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#767676"><h3>Sin repositorio para "${categoryId}"</h3></div>`;
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const g = new PintarestaGallery();

  document.getElementById('btnLogo').onclick       = () => g.recargar();
  document.getElementById('btnBack').onclick       = () => g.loteAnterior();
  document.getElementById('btnNext').onclick       = () => g.siguienteLote();
  document.getElementById('btnReload').onclick     = () => g.recargar();
  document.getElementById('fileInput').onchange    = e => { if (e.target.files.length) g.cargarArchivosLocales(e.target.files); };
  document.getElementById('btnViewJSON').onclick   = () => g.mostrarJSON();
  document.getElementById('btnCloseModal').onclick = () => document.getElementById('modalJSON').classList.remove('active');
  document.getElementById('btnCopyJSON').onclick   = () => g.copiarJSON();
  document.getElementById('btnDownloadJSON').onclick = () => g.descargarJSON();
  document.getElementById('modalJSON').onclick     = e => { if (e.target === document.getElementById('modalJSON')) document.getElementById('modalJSON').classList.remove('active'); };
  
  document.getElementById('btnCloseVideo').onclick = () => VideoModal.close();
  document.getElementById('modalVideo').onclick    = e => { if (e.target === document.getElementById('modalVideo')) VideoModal.close(); };
  
  document.getElementById('btnClose3D').onclick    = () => ThreeModal.close();
  document.getElementById('modal3D').onclick       = e => { if (e.target === document.getElementById('modal3D')) ThreeModal.close(); };

  let t;
  document.getElementById('searchInput').oninput = e => { clearTimeout(t); t = setTimeout(() => g.filtrarMedia(e.target.value), 300); };

  document.addEventListener('keydown', e => {
    if (document.getElementById('modal3D').classList.contains('active'))    { if (e.key === 'Escape') ThreeModal.close(); return; }
    if (document.getElementById('modalVideo').classList.contains('active')) { if (e.key === 'Escape') VideoModal.close();  return; }
    if (document.getElementById('modalJSON').classList.contains('active'))  { if (e.key === 'Escape') document.getElementById('modalJSON').classList.remove('active'); return; }
    if (e.target.tagName === 'INPUT') return;
    if      (e.key === 'ArrowLeft')          g.loteAnterior();
    else if (e.key === 'ArrowRight')         g.siguienteLote();
    else if (e.key === 'r' || e.key === 'R') g.recargar();
  });

  document.getElementById('btnsuelos').onclick     = () => g.cargarCategoria('suelos');
  document.getElementById('btscenes').onclick      = () => g.cargarCategoria('scenes');
  document.getElementById('btnmaquinas').onclick   = () => g.cargarCategoria('maquinas');
  document.getElementById('btnparedes').onclick    = () => g.cargarCategoria('iparedes');
  document.getElementById('btmaderas').onclick     = () => g.cargarCategoria('idmaderas');
  document.getElementById('btnmetales').onclick    = () => g.cargarCategoria('idmetales');
  document.getElementById('btnNormalsmap').onclick = () => g.cargarCategoria('idnormals');
  document.getElementById('btnidrepjob').onclick   = () => g.cargarCategoria('MESH3D');

  g.iniciar();
  window.galeriaPintaresta = g;
}); 
</script>

</body>
